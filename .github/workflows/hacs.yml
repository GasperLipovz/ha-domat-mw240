name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
